{% extends "base.html" %}
{% block content %}
<form action="/update/{{ expense.id }}" method="POST">
    <input type="text" name="desc" value="{{ expense.description }}" required>
    <input type="number" name="amount" value="{{ expense.amount }}" required>
    <input type="date" name="date" value="{{ expense.date }}" required>
    <select name="category">
        <option value="Food">Food</option>
        <option value="Medical">Medical Supplies</option>
        <option value="Utility">Utility</option>
        <option value="Clothes">Clothes</option>
        <option value="Travel">Travel</option>
        <option value="Stationary">Stationary</option>
        <option value="Entertainment">Entertainment</option>
    </select>
    <button type="submit">Save</button>
</form>
{% endblock %}
